; ESP32 Vehicular IoT System - single PlatformIO project, two firmware images.
;
;   pio run -e sensor_node          build the sensor-node firmware
;   pio run -e gateway              build the Azure gateway firmware
;   pio run -e sensor_node_synthetic  sensor node with clearly-flagged fake readings
;   pio test -e native              host unit + integration tests (no hardware needed)
;   python tools/verify.py          everything above, in one command
;
; Supported and built: Arduino-ESP32 3.3.12 (ESP-IDF 5.5.5) on classic ESP32
; (board esp32dev). Other core versions have not been built and are not claimed.

[platformio]
src_dir = firmware
default_envs = sensor_node, gateway

[esp32_common]
platform = platformio/espressif32@8.0.0
; Pin the exact framework packages the platform resolved when this was built.
platform_packages =
    platformio/framework-arduinoespressif32@4.30312.261024
    platformio/framework-arduinoespressif32-esp32-libs@3.3.12
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -I config
    -I firmware/common
    -D ARDUINOJSON_ENABLE_NAN=0
    -D ARDUINOJSON_ENABLE_INFINITY=0
lib_deps =
    bblanchon/ArduinoJson@7.4.3

[env:sensor_node]
extends = esp32_common
build_src_filter = +<common/> +<sensor_node/>
lib_deps =
    ${esp32_common.lib_deps}
    rfetick/MPU6050_light@1.1.0
    adafruit/DHT sensor library@1.4.7
    adafruit/Adafruit Unified Sensor@1.1.15

[env:sensor_node_synthetic]
extends = env:sensor_node
build_flags =
    ${esp32_common.build_flags}
    -D VC_SYNTHETIC_SENSORS=1

[env:gateway]
extends = esp32_common
; TLS + MQTT + Wi-Fi + ESP-NOW does not leave enough headroom in the default
; 1.25 MB app slot; min_spiffs keeps two OTA slots of 1.9 MB each.
board_build.partitions = min_spiffs.csv
build_src_filter = +<common/> +<gateway/>
lib_deps =
    ${esp32_common.lib_deps}
    adafruit/DHT sensor library@1.4.7
    adafruit/Adafruit Unified Sensor@1.1.15
    azure/Azure SDK for C@1.1.8

; Host-side tests of the hardware-independent core (lib/vehicle_core):
;   test/test_core         unit tests, known-answer vectors, seeded decoder fuzz run
;   test/test_integration  HOST INTEGRATION HARNESS: real sensor + gateway logic over a
;                          simulated radio / storage / clock / MQTT broker (no hardware)
[env:native]
platform = platformio/native@1.2.1
build_src_filter = -<*>
test_build_src = no
build_flags =
    -D ARDUINOJSON_ENABLE_NAN=0
    -D ARDUINOJSON_ENABLE_INFINITY=0
    -D UNITY_SUPPORT_64
test_framework = unity
lib_deps =
    bblanchon/ArduinoJson@7.4.3
    ; pinned explicitly (test_framework alone would install the range ^2.6.1)
    throwtheswitch/Unity@2.6.1
lib_compat_mode = off

; Same tests with AddressSanitizer + UndefinedBehaviorSanitizer; any report aborts the
; run. Needs a Linux/macOS gcc or clang (MinGW has no ASan): run it in CI, WSL, or
; `python tools/verify.py --sanitize`, which uses Docker when the host cannot.
[env:native_sanitize]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -fsanitize=address,undefined
    -fno-sanitize-recover=all
    -fno-omit-frame-pointer
    -g
extra_scripts = post:tools/pio_sanitize_link.py

